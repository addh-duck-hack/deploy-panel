<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deploy Panel</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-box">
      <img src="icon.svg" alt="" class="gate-icon" width="56" height="56" />
      <h1>Deploy Panel</h1>
      <p>Ingresa el token de acceso</p>
      <input id="tokenInput" type="password" placeholder="Token" autocomplete="off" />
      <button id="tokenSubmit">Entrar</button>
      <p id="gateError" class="error"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header>
      <button id="homeBtn" class="brand">
        <img src="icon.svg" alt="" width="32" height="32" />
        <span>Deploy Panel</span>
      </button>
      <button id="logout">Salir</button>
    </header>

    <main>
      <section id="projectListView">
        <section id="projectList" class="project-list"></section>
      </section>

      <section id="projectDetailView" class="hidden">
        <button id="backBtn" class="back-btn">&larr; REGRESAR</button>

        <div class="detail-head">
          <h2 id="detailName"></h2>
          <div class="detail-meta">
            <span id="detailType" class="badge"></span>
            <span class="detail-branch">rama: <strong id="detailBranch">&mdash;</strong></span>
          </div>
        </div>

        <p id="detailError" class="error"></p>

        <div id="detailActions" class="detail-actions">
          <button id="detailDeployBtn" class="action-btn primary">Actualizar (pull + rebuild)</button>

          <div class="branch-switch">
            <input id="branchInput" type="text" placeholder="nombre-de-rama" autocomplete="off" spellcheck="false" />
            <button id="branchSwitchBtn" class="action-btn">Cambiar rama</button>
          </div>

          <div id="configFilesGroup" class="config-files hidden">
            <span class="config-files-label">Archivos de configuración</span>
            <div id="configFilesList" class="config-files-list"></div>
          </div>
        </div>

        <div id="terminalWrap" class="terminal">
          <div class="terminal-header">
            <span>salida</span>
            <span id="terminalStatus" class="status"></span>
          </div>
          <pre id="terminalOutput">$ _</pre>
        </div>
      </section>
    </main>

    <div id="configModal" class="log-modal hidden">
      <div class="log-box">
        <div class="log-header">
          <span id="configModalName"></span>
          <button id="configClose">Cerrar</button>
        </div>
        <textarea id="configTextarea" class="env-textarea" spellcheck="false" autocomplete="off"></textarea>
        <div class="env-footer">
          <span id="configError" class="error"></span>
          <button id="configSaveBtn" class="action-btn primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
